<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 580" width="100%" height="100%" style="background-color: #0d1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="kaliGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a085c" />
      <stop offset="100%" stop-color="#160430" />
    </linearGradient>
    <linearGradient id="pfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="winGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b48" />
      <stop offset="100%" stop-color="#071524" />
    </linearGradient>
    <linearGradient id="wazuhGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Title -->
  <text x="475" y="35" fill="#f0f6fc" font-size="20" font-weight="bold" text-anchor="middle">DFIR / CTI / SOC Lab Network Architecture</text>
  <text x="475" y="55" fill="#8b949e" font-size="12" text-anchor="middle">Two-Host Physical Isolation with Hybrid Bridged/LAN Topology</text>

  <!-- Physical Boundary: LAPTOP -->
  <rect x="30" y="80" width="240" height="460" rx="10" fill="none" stroke="#30363d" stroke-width="2" stroke-dasharray="6 4" />
  <rect x="40" y="90" width="120" height="22" rx="4" fill="#21262d" />
  <text x="100" y="105" fill="#8b949e" font-size="11" font-weight="bold" text-anchor="middle">LAPTOP (Host)</text>

  <!-- Physical Boundary: DESKTOP -->
  <rect x="300" y="80" width="620" height="460" rx="10" fill="none" stroke="#30363d" stroke-width="2" stroke-dasharray="6 4" />
  <rect x="310" y="90" width="180" height="22" rx="4" fill="#21262d" />
  <text x="400" y="105" fill="#8b949e" font-size="11" font-weight="bold" text-anchor="middle">DESKTOP "smoot" (Host)</text>

  <!-- Home Network Cloud / Subnet -->
  <rect x="50" y="130" width="840" height="80" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
  <text x="70" y="155" fill="#58a6ff" font-size="13" font-weight="bold">Home Network Subnet (Telekom Router)</text>
  <text x="70" y="173" fill="#8b949e" font-size="11">CIDR: 192.168.1.0/24 | Physical Layer: WiFi (Laptop) &amp; Ethernet (Desktop)</text>

  <!-- Kali Box -->
  <g transform="translate(50, 260)">
    <rect x="0" y="0" width="200" height="240" rx="8" fill="url(#kaliGrad)" stroke="#a855f7" stroke-width="2" filter="url(#glow)" />
    <rect x="10" y="10" width="180" height="25" rx="4" fill="#a855f7" fill-opacity="0.2" />
    <text x="100" y="27" fill="#d8b4fe" font-size="12" font-weight="bold" text-anchor="middle">Kali Linux (Attacker)</text>
    <text x="15" y="60" fill="#c9d1d9" font-size="11" font-weight="bold">Hypervisor:</text>
    <text x="15" y="75" fill="#8b949e" font-size="11">VirtualBox</text>
    <text x="15" y="100" fill="#c9d1d9" font-size="11" font-weight="bold">Adapter 1 (Bridged):</text>
    <text x="15" y="115" fill="#58a6ff" font-size="11">192.168.1.234</text>
    <text x="15" y="140" fill="#c9d1d9" font-size="11" font-weight="bold">Role:</text>
    <text x="15" y="155" fill="#8b949e" font-size="11">Red Team / CTI Node</text>
    <text x="15" y="180" fill="#c9d1d9" font-size="11" font-weight="bold">Tools Used:</text>
    <text x="15" y="195" fill="#ce9178" font-size="11">nmap, smbclient</text>
  </g>

  <!-- pfSense Box -->
  <g transform="translate(320, 260)">
    <rect x="0" y="0" width="180" height="240" rx="8" fill="url(#pfGrad)" stroke="#f97316" stroke-width="2" />
    <rect x="10" y="10" width="160" height="25" rx="4" fill="#f97316" fill-opacity="0.2" />
    <text x="90" y="27" fill="#ffedd5" font-size="12" font-weight="bold" text-anchor="middle">pfSense Firewall</text>
    <text x="15" y="55" fill="#ea580c" font-size="11" font-weight="bold">WAN (em0 - Bridged):</text>
    <text x="15" y="70" fill="#58a6ff" font-size="11">192.168.1.152</text>
    <text x="15" y="95" fill="#ea580c" font-size="11" font-weight="bold">LAN (em1 - VMnet2):</text>
    <text x="15" y="110" fill="#3fb950" font-size="11">10.10.10.1 /24</text>
    <text x="15" y="135" fill="#c9d1d9" font-size="11" font-weight="bold">Port Forward Rules:</text>
    <text x="15" y="150" fill="#8b949e" font-size="10">WAN :445 →</text>
    <text x="15" y="163" fill="#8b949e" font-size="10">10.10.10.100:445</text>
    <text x="15" y="188" fill="#c9d1d9" font-size="11" font-weight="bold">Services:</text>
    <text x="15" y="203" fill="#8b949e" font-size="11">DHCP Server, NAT</text>
  </g>

  <!-- Isolated VMnet2 Subnet Box -->
  <rect x="520" y="235" width="380" height="280" rx="8" fill="#010409" stroke="#238636" stroke-width="1.5" stroke-dasharray="4 4" />
  <text x="535" y="255" fill="#3fb950" font-size="12" font-weight="bold">Isolated Internal Network (VMnet2)</text>
  <text x="800" y="255" fill="#8b949e" font-size="11">10.10.10.0/24</text>

  <!-- Windows Victim Box -->
  <g transform="translate(535, 275)">
    <rect x="0" y="0" width="165" height="225" rx="6" fill="url(#winGrad)" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="8" y="8" width="149" height="22" rx="4" fill="#38bdf8" fill-opacity="0.2" />
    <text x="82" y="23" fill="#bae6fd" font-size="11" font-weight="bold" text-anchor="middle">Windows-Victim-01</text>
    <text x="12" y="50" fill="#c9d1d9" font-size="10" font-weight="bold">IP Address:</text>
    <text x="12" y="63" fill="#3fb950" font-size="10">10.10.10.100</text>
    <text x="12" y="83" fill="#c9d1d9" font-size="10" font-weight="bold">OS:</text>
    <text x="12" y="96" fill="#8b949e" font-size="10">Windows 11 Pro</text>
    <text x="12" y="116" fill="#c9d1d9" font-size="10" font-weight="bold">Telemetry/Agents:</text>
    <text x="12" y="129" fill="#7ee787" font-size="10">• Sysmon (SwiftOnSec)</text>
    <text x="12" y="142" fill="#7ee787" font-size="10">• Wazuh Agent 4.14.7</text>
    <text x="12" y="162" fill="#c9d1d9" font-size="10" font-weight="bold">Exposed Service:</text>
    <text x="12" y="175" fill="#f87171" font-size="10">SMB (Port 445/TCP)</text>
  </g>

  <!-- Wazuh Manager Box -->
  <g transform="translate(720, 275)">
    <rect x="0" y="0" width="165" height="225" rx="6" fill="url(#wazuhGrad)" stroke="#34d399" stroke-width="1.5" />
    <rect x="8" y="8" width="149" height="22" rx="4" fill="#34d399" fill-opacity="0.2" />
    <text x="82" y="23" fill="#a7f3d0" font-size="11" font-weight="bold" text-anchor="middle">Wazuh-Manager</text>
    <text x="12" y="50" fill="#c9d1d9" font-size="10" font-weight="bold">IP Address:</text>
    <text x="12" y="63" fill="#3fb950" font-size="10">10.10.10.102</text>
    <text x="12" y="83" fill="#c9d1d9" font-size="10" font-weight="bold">OS:</text>
    <text x="12" y="96" fill="#8b949e" font-size="10">Ubuntu Server 24.04</text>
    <text x="12" y="116" fill="#c9d1d9" font-size="10" font-weight="bold">Components:</text>
    <text x="12" y="129" fill="#8b949e" font-size="10">• Wazuh Indexer</text>
    <text x="12" y="142" fill="#8b949e" font-size="10">• Wazuh Server</text>
    <text x="12" y="155" fill="#8b949e" font-size="10">• Wazuh Dashboard</text>
    <text x="12" y="175" fill="#c9d1d9" font-size="10" font-weight="bold">Custom Detections:</text>
    <text x="12" y="188" fill="#facc15" font-size="10">Rule 100010 (NTLM)</text>
  </g>

  <!-- Connectors -->
  <!-- Kali to Home Subnet -->
  <line x1="150" y1="260" x2="150" y2="210" stroke="#a855f7" stroke-width="2" stroke-dasharray="4 2" />
  <!-- pfSense WAN to Home Subnet -->
  <line x1="410" y1="260" x2="410" y2="210" stroke="#f97316" stroke-width="2" />
  <!-- pfSense LAN to Internal Subnet -->
  <line x1="500" y1="380" x2="520" y2="380" stroke="#3fb950" stroke-width="2" />
  <!-- Agent Traffic: Windows to Wazuh -->
  <path d="M 700 380 L 720 380" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Flow Label -->
  <text x="280" y="195" fill="#f87171" font-size="10" font-weight="bold">Attack Traffic (SMB Port 445 Forwarded)</text>
  <path d="M 250 200 L 400 200" stroke="#f87171" stroke-width="1.5" marker-end="url(#redArrow)" />

  <!-- Markers -->
  <defs>
    <marker id="redArrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#f87171" />
    </marker>
  </defs>
</svg>
 